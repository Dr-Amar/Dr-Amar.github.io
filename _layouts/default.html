<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0b2030">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav-wrap">
      <a class="brand" href="/" aria-label="Dr. Muhammad Amar Gul home">
        <span class="brand-mark">AG</span>
        <span>Muhammad Amar Gul</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="/about/">About</a>
        <a href="/research/">Research</a>
        <a href="/projects/">Projects</a>
        <a href="/publications/">Publications</a>
        <a href="/cv/">CV</a>
        <a class="nav-cta" href="/contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <div class="footer-title">Dr. Muhammad Amar Gul</div>
        <div>Geoscience · GeoAI · Mineral Discovery</div>
      </div>
      <div class="footer-links">
        <a href="https://github.com/Dr-Amar">GitHub</a>
        <a href="https://scholar.google.com/citations?user=EDfhb1gAAAAJ&hl=en">Google Scholar</a>
        <a href="https://www.linkedin.com/in/muhammad-amar-gul-phd-65397151">LinkedIn</a>
        <a href="https://aimex-geoai.github.io">AIMEX Lab</a>
      </div>
    </div>
  </footer>
</body>
</html>
